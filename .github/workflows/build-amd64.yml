name: Build amd64 image
on:
  push:
    branches:
      - build/**
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit
        id: shortcommit
        run: echo "value=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          build-args: |
            COMMIT=${{ steps.shortcommit.outputs.value }}
            VERSION=fix-directory-mode
          tags: |
            ghcr.io/evan314159/gluetun:fix-directory-mode
            ghcr.io/evan314159/gluetun:${{ steps.shortcommit.outputs.value }}
          push: true
